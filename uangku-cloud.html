<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="UangKu — catatan keuangan, versi HP">
<title>UangKu</title>
<style>
/* ============================================================
   UangKu — versi HP (Android / Chrome)
   • Hitam-putih · warna HANYA untuk peringatan
   • Tanpa server · tanpa internet · data tersimpan di berkas ini
   • Tampilan mengikuti rancangan yang sudah disetujui (BEKU)
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff; --text:#111111; --text2:#6b6b6b; --line:#e0e0e0;
  --ink:#111111; --onink:#ffffff; --soft:#f6f6f6; --warn:#b8860b; --danger:#b00020;
  --sp:12px; --rad:10px;
}
html.dark{
  --bg:#0d0d0d; --text:#f5f5f5; --text2:#9a9a9a; --line:#2a2a2a;
  --ink:#f5f5f5; --onink:#0d0d0d; --soft:#171717; --warn:#e0b64a; --danger:#ff6b7a;
}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.35;
  display:flex;flex-direction:column;
  height:100vh;          /* fallback — browser lama tidak kenal dvh */
  height:100dvh;         /* Android Chrome 108+ : ikut tinggi nyata layar */
  max-height:100dvh;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.mono{font-variant-numeric:tabular-nums}

/* ---------------------- kepala ---------------------- */
.head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) var(--sp) 10px;
  border-bottom:1px solid var(--line);background:var(--bg);
  position:relative;z-index:20;
}
.head .h1{font-size:15px;font-weight:700;margin:0;flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head button{
  flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:8px;min-width:32px;height:32px;padding:0 8px;font-size:13px;
  font-family:inherit;cursor:pointer;
}
.head button:active{background:var(--soft)}
.head .plus{background:var(--ink);color:var(--onink);border-color:var(--ink);font-size:19px;font-weight:700}

/* ---------------------- isi ---------------------- */
.body{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:var(--sp) var(--sp) 24px;overscroll-behavior:contain}
.body[hidden]{display:none}

.sec{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.06em;
  text-transform:uppercase;margin:16px 2px 7px}
.sec:first-child{margin-top:2px}

/* kotak saldo */
.saldo{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--bg)}
.saldo .top{padding:12px;border-bottom:1px solid var(--line)}
.saldo .top .k{font-size:11px;color:var(--text2)}
.saldo .top .v{font-size:25px;font-weight:700;margin-top:2px;letter-spacing:-.5px}
.saldo .top .v small{font-size:12px;font-weight:400;color:var(--text2);margin-left:3px}
.saldo .grid{display:grid;grid-template-columns:repeat(3,1fr)}
/* 4 kolom: Saldo awal · Masuk · Keluar · Saldo akhir
   (permintaan Bapak 25 Sep 2026 — bagian atas dihapus, Saldo akhir dipindah ke bawah) */
.saldo .grid.k4{grid-template-columns:repeat(4,1fr)}
.saldo .grid.k4 .cell{padding:9px 7px}
.saldo .grid.k4 .cell .v{font-size:11.5px;letter-spacing:-.3px}
.saldo .cell{padding:9px 10px;border-right:1px solid var(--line)}
.saldo .cell:last-child{border-right:0}
/* label boleh TURUN 2 BARIS — lebih baik daripada terpotong "Saldo akh…" */
.saldo .cell .k{font-size:10px;color:var(--text2);line-height:1.15;overflow-wrap:break-word}
.saldo .cell .v{font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.saldo .cell .v.neg{color:var(--danger)}

/* kartu */
.card{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--bg);margin-bottom:8px}
.chead{padding:10px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;
  gap:8px;cursor:pointer;background:var(--soft);border-bottom:1px solid var(--line)}
.chead .ctog{margin-left:auto;font-weight:400;color:var(--text2);font-size:11px}
.cbody{padding:4px 12px}
.card.fold .cbody{display:none}
.card.fold.open .cbody{display:block}
.crow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);
  font-size:13px}
.crow:last-child{border-bottom:0}
.crow .cl{color:var(--text2);flex:0 0 auto}
.crow b{margin-left:auto;white-space:nowrap}
.crow .mini{font-size:11px;color:var(--text2);flex:0 0 auto}

/* peringatan — satu-satunya tempat warna */
.alert{border:1px solid var(--warn);color:var(--warn);border-radius:var(--rad);
  padding:9px 12px;font-size:12.5px;font-weight:600;margin:10px 0;display:flex;
  align-items:center;gap:8px}
.alert .go{margin-left:auto;font-weight:700}
.hint{border:1px solid var(--line);border-radius:var(--rad);padding:9px 12px;font-size:11.5px;
  color:var(--text2);margin:10px 0;line-height:1.5}

/* tombol pintu */
.goto{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:var(--rad);
  padding:12px;font-family:inherit;font-size:14px;cursor:pointer;margin:8px 0}
.goto:active{background:var(--soft)}
.goto .gi{font-size:21px;flex:0 0 auto}
.goto .gt{font-weight:700;display:block;font-size:14px}
.goto .gs{color:var(--text2);font-size:11.5px;display:block}
.goto .garrow{margin-left:auto;color:var(--text2);font-size:19px}
.goto.accent{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.goto.accent .gs{color:var(--onink);opacity:.72}

/* DAFTAR TRANSAKSI — TABEL HP (meniru Transaksi di keuangan:
   Tanggal · Keterangan · Fund · Tag · Tipe · Jumlah).
   Tabel hanya boleh digeser ke samping DI DALAM kotaknya. */
.txw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad);margin-bottom:8px}
.txt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
.txt th{font-size:10px;font-weight:700;color:var(--text2);text-align:left;padding:6px 4px;
  border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap;overflow:hidden}
.txt td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow:hidden}
.txt tr:last-child td{border-bottom:0}
.txt .c-tgl{width:40px;white-space:nowrap;color:var(--text2)}
.txt .c-dk{width:30px;text-align:center}
.txt .c-jml{width:92px;text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.txt .sub{font-size:10px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt .ket{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;font-size:11.5px;line-height:1.3}
.txt .bd{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 3px;
  font-size:9.5px;font-weight:400;color:var(--text2);margin-left:2px;white-space:nowrap}
.txt .bd.pajak{border-color:var(--warn);color:var(--warn)}
.txt tr.pr td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.txt tr.grp td{background:var(--soft);font-size:10.5px;color:var(--text2);padding:5px 6px;white-space:normal}
.txt tr.grp b{color:var(--text)}

.daylabel{font-size:11px;font-weight:700;color:var(--text2);margin:14px 2px 6px;
  display:flex;align-items:center;gap:8px}
.daylabel::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}

/* PEMILIH TAG — muncul hanya saat urutan = Tag (hemat ruang, aturan C10).
   Satu baris tertutup; klik → grid tag terbuka; pilih tag → menutup lagi. */
.tagsum{display:flex;align-items:center;gap:6px;width:100%;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;min-width:0;margin-bottom:6px}
.tagsum .nm{flex:1 1 auto;min-width:0;text-align:left;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tagsum .ar{flex:0 0 auto;font-size:10px;color:var(--text2)}
/* grid tag di layar Transaksi — di luar .chips, jadi kolom & jarak ditulis di sini */
.chipgrid.buka{display:grid;gap:6px;margin-bottom:8px;
  grid-template-columns:repeat(var(--kolom,3),minmax(0,1fr))}

/* filter — SOURCE FUND, hemat ruang (revisi Bapak 25 Sep 2026)
   Ruang kerja harus seefektif mungkin. Yang tampak HANYA SATU baris:
   nama fund yang sedang dipilih (atau "Semua Fund").
   • Klik baris itu  → grid fund TERBUKA
   • Pilih satu fund → grid MENUTUP lagi, barisnya berganti nama fund itu
   Jumlah kolom grid ikut pengaturan "Daftar Fund" (kolomFund). */
.chips{display:block;margin-bottom:8px}
.chips .kepala{display:flex;align-items:center;gap:6px;width:100%;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:14px;padding:7px 10px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;min-width:0}
.chips.ada .kepala{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.chips .kepala .nm{flex:1 1 auto;min-width:0;text-align:left;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chips .kepala .pn{flex:0 0 auto;font-size:10px;opacity:.75;margin-left:6px;letter-spacing:-.2px}
.chips .kepala .ar{flex:0 0 auto;font-size:10px;opacity:.8;margin-left:6px}
.chips .chipgrid{display:none;gap:6px;margin-top:6px;
  grid-template-columns:repeat(var(--kolom,3),minmax(0,1fr))}
.chips.terbuka .chipgrid{display:grid}
/* Chip: nama DIPOTONG dengan `…` (1 baris) — keputusan Bapak:
   *"masih kebaca.. ok"* → pemotongan masih bisa dikenali, dan bentuknya
   rapi & seragam (tinggi sama). Nama lengkap ada di tooltip.
   ⚠️ `-webkit-line-clamp` TIDAK bekerja di <button> — jangan dipakai. */
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:14px;padding:7px 6px;font-size:11px;font-family:inherit;cursor:pointer;
  min-width:0;text-align:center;line-height:1.25;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.chipgrid .chip.semua{grid-column:1 / -1}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:var(--rad);padding:8px 11px;margin-bottom:8px;background:var(--bg)}
.search input{border:0;outline:0;background:transparent;color:var(--text);
  font-family:inherit;font-size:14px;width:100%;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1 1 0;border:0;background:var(--bg);color:var(--text);font-family:inherit;
  font-size:12px;padding:8px 4px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--onink)}

/* ============================================================
   KARTU GRID — Source Fund & Tag
   Tujuan: SEMUA fund terlihat sekaligus walau jumlahnya bertambah.
   • Jumlah kolom dihitung dari LEBAR TERSEDIA → baris turun ke bawah.
   • 🆕 **Nama fund BOLEH DIPOTONG dengan tanda `…`** (maksimum 2 baris),
     supaya lebih banyak kolom muat. Keputusan Bapak 25 Sep 2026:
     *"coba nama fund dipotong saja.. biar muat.. sepertinya tidak terlalu
      sulit mengenali nama walau terpotong"*
   • 🔴 **ANGKA JANGAN DIPOTONG** — angka terpotong bisa salah baca
     (mis. 22.057.864 terbaca 22.057). Angka hanya boleh patah di titik ribuan.
   • Nama fund LENGKAP selalu bisa dibaca di:
     ① tooltip (tekan lama) ② halaman Detail ③ penyaring/chip di Transaksi.
   ============================================================ */
.grid4{display:grid;gap:6px;margin-bottom:8px;align-items:start;
  grid-template-columns:repeat(var(--kolom,2),minmax(0,1fr))}

/* satu kartu kecil di dalam grid */
.item{border:1px solid var(--line);border-radius:var(--rad);background:var(--bg);
  padding:6px 7px;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .baris{display:flex;align-items:flex-start;gap:3px;min-width:0}
.item .ic{font-size:13px;flex:0 0 auto;line-height:1.25}
/* nama — DIPOTONG dengan … setelah 2 baris */
.item .nm{font-size:11px;font-weight:600;min-width:0;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;word-break:normal}
/* angka — TIDAK dipotong (hanya boleh patah di titik ribuan) */
.item .val{font-size:10.5px;font-weight:700;margin-top:auto;line-height:1.3;letter-spacing:-.2px;
  overflow-wrap:break-word;word-break:normal;font-variant-numeric:tabular-nums}
.item .val.neg{color:var(--danger)}
.item .sub{font-size:8.5px;color:var(--text2);line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;word-break:normal}
.item.warn{border-color:var(--danger)}
.item.warn .val{color:var(--danger)}

.pill{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  color:var(--text2);margin-left:4px;white-space:nowrap}
.pill.k{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.item .pill{margin-left:0;padding:0 4px;flex:0 0 auto}

/* CATAT (TES) — layar input multi-jurnal (hitam-putih) */
.tl-banner{font-size:11px;font-weight:700;border:1px dashed var(--text);border-radius:var(--rad);
  padding:7px 10px;margin-bottom:6px;text-align:center}
.tl-card{border:1px solid var(--line);border-radius:var(--rad);padding:10px;margin-bottom:8px;background:var(--bg)}
.tl-card input,.tl-card select,.tl-row input,.tl-row select{width:100%;font:inherit;border:1px solid var(--line);
  border-radius:8px;padding:8px;background:var(--bg);color:var(--text);min-width:0}
.tl-row{padding:8px 0;border-bottom:1px dashed var(--line)}
.tl-row:first-child{padding-top:0}
.tl-row:last-child{border-bottom:0;padding-bottom:0}
/* 🔴 SATU BARIS: fund · tag · D/K · harga · ✕ (permintaan Bapak 13 Okt 2026).
   Lebar kolom diatur lewat --w1..--w5 supaya bisa menyesuaikan lebar layar.
   🔴 19 Okt 2026: harga DIKUNCI (--w4) supaya sumber & tag dapat ruang lebih. */
.tl-row{display:grid;gap:4px;align-items:center;
  grid-template-columns:var(--w1,46px) var(--w2,58px) var(--w3,46px) var(--w4,90px) var(--w5,26px)}
.tl-row select,.tl-row input{padding:7px 3px;font-size:var(--fs,11px)}
.tl-sempit .tl-row{gap:3px}
.tl-sempit .tl-row select,.tl-sempit .tl-row input{padding:7px 1px}
.tl-sempit .tl-fund,.tl-sempit .tl-tag{padding-right:10px !important}
/* fund & tag: teks di tengah, tapi sisakan ruang untuk panah pulldown di kanan
   supaya panahnya TIDAK terpotong (keluhan Bapak 13 Okt 2026) */
/* 🔴 19 Okt 2026: nama fund & tag ditulis PENUH (bukan SPB/RMH) — Bapak lupa
   arti singkatannya. Nama kepanjangan dipotong "…" oleh CSS (text-overflow). */
.tl-fund{font-weight:700;text-align:center;text-align-last:center;letter-spacing:-.3px;
  padding-right:14px !important;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.tl-tag{text-align:center;text-align-last:center;letter-spacing:-.4px;
  padding-right:14px !important;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.tl-jml{text-align:right;font-weight:700;letter-spacing:-.4px}
/* 🔴 19 Okt 2026: D/K jadi SATU tombol berganti (Kredit ⇄ Debit).
   Tag yang mengunci arah → tombol mati (abu-abu, tidak bisa diklik). */
.tl-dk{display:block}
.tl-dk button{width:100%;padding:7px 0;font-size:11px;border-radius:8px;letter-spacing:-.2px}
.tl-dk button:disabled{cursor:default;opacity:.55}
.tl-dk.auto button{color:var(--text2)}
.tl-del{height:30px;padding:0;font-size:13px;line-height:1}
.tl-del{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;height:36px;cursor:pointer;font:inherit}
.tl-r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl-r:last-child{border-bottom:0}
.tl-r.sub{padding-left:12px;color:var(--text2);font-size:12px}
.tl-tes{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.tl-tes:last-child{border-bottom:0}
.tl-tes b{font-size:13px;overflow-wrap:anywhere}
.tl-tes small{display:block;color:var(--text2);font-size:11px}
/* TAG — borang tambah/ubah (konsep sama dengan keuangan Settings → TagsTab,
   permintaan Bapak 19 Okt 2026). Hitam-putih, rapat, muat layar 50%. */
.tf{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tf .tfk{flex:0 0 78px;font-size:11.5px;color:var(--text2)}
.tf input[type=text],.tf select{flex:1 1 auto;min-width:0;font:inherit;font-size:12px;
  border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--text)}
.tfl{font-size:11.5px;color:var(--text2);margin-bottom:4px}
.emj{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin-bottom:8px}
.emj button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 0;
  font-size:14px;line-height:1.25;cursor:pointer}
.emj button.on{background:var(--ink);border-color:var(--ink)}
.tfcek{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:8px;cursor:pointer}
.tfcek input{width:16px;height:16px;flex:0 0 auto;margin:0}
.trow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.trow:last-child{border-bottom:0}
.trow .ic{flex:0 0 auto;font-size:14px}
.trow .nm{flex:1 1 auto;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ar{flex:0 0 auto;font-size:10.5px;color:var(--text2);white-space:nowrap}
.trow .btn-kecil{padding:5px 8px;font-size:11px}
.item.kunci{background:var(--soft)}
.btn-kecil{border:1px solid var(--text);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn-kecil:disabled{opacity:.35;cursor:default}
.btn-utama{border:1px solid var(--ink);background:var(--ink);color:var(--onink);border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer}

/* tab bawah */
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:30}
.tabs button{flex:1 1 0;border:0;background:transparent;color:var(--text2);font-family:inherit;
  font-size:10.5px;padding:7px 2px 8px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-height:50px;justify-content:center}
.tabs button .ti{font-size:18px;line-height:1}
.tabs button.on{color:var(--text);font-weight:700}

/* bahasa */
.langrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--rad);margin-bottom:6px;background:var(--bg);cursor:pointer;width:100%;
  font-family:inherit;font-size:14px;color:var(--text);text-align:left}
.langrow.on{border-color:var(--ink);border-width:2px;padding:10px 11px;font-weight:700}
.langrow .chk{margin-left:auto;font-size:16px}

/* istilah */
.grp{border:1px solid var(--line);border-radius:var(--rad);margin-bottom:8px;overflow:hidden}
.grp .gh{padding:9px 12px;background:var(--soft);font-size:12px;font-weight:700;
  border-bottom:1px solid var(--line)}

function rp(n) {
  var neg = n < 0;
  var a = Math.abs(Math.round(n));
  var s = String(a).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + s;

/* 🔴 SELALU 2 DESIMAL (keputusan Bapak 13 Okt 2026).

function rp2(n) {
  var neg = n < 0;
  var a = Math.abs(n);
  var bulat = Math.floor(a + 1e-9);
  var sen = Math.round((a - bulat) * 100);
  if (sen === 100) { bulat++; sen = 0; }
  var s = String(bulat).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  s += ',' + (sen < 10 ? '0' + sen : sen);
  return (neg ? '−' : '') + s;

function simpanCloud() {
  try {
    localStorage.setItem('uangku.pin', CLOUD.pin);
    localStorage.setItem('uangku.alamat', CLOUD.alamat);
  } catch (e) { /* diam */ }
}

/** Panggil Worker. Semua nilai lewat JSON — tidak ada SQL dari halaman. */
function panggilServer(aksi, tambahan) {
  var isi = { pin: CLOUD.pin, aksi: aksi };
  if (tambahan) { for (var k in tambahan) { if (tambahan.hasOwnProperty(k)) isi[k] = tambahan[k]; } }
  return fetch(CLOUD.alamat, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(isi)
  }).then(function (r) {
    return r.json().then(function (j) {
      if (r.status === 401) throw new Error('PIN salah');
      if (!j.ok) throw new Error(j.error || ('Gagal (HTTP ' + r.status + ')'));
      return j;
    });
  }).catch(function (e) {
    if (e && e.message) throw e;
    throw new Error('Tidak bisa menghubungi server');
  });
}

var JUDUL = {
  dash: function () { return t('Dashboard'); },
  tx: function () { return t('Transaksi'); },
  input: function () { return t('Catat'); },
  riwayat: function () { return t('Riwayat'); },
  set: function () { return t('Pengaturan'); }
};

function tampil(nama, sub) {
  layar = nama; subNama = sub || '';
  ['pgDash','pgTx','pgInput','pgSet','pgSub','pgRiwayat'].forEach(function (id) {
    document.getElementById(id).hidden = true;
  });
  var peta = { dash: 'pgDash', tx: 'pgTx', input: 'pgInput', set: 'pgSet', sub: 'pgSub', riwayat: 'pgRiwayat' };
  document.getElementById(peta[nama === 'sub' ? 'sub' : nama] || 'pgDash').hidden = false;

  document.getElementById('btnBack').hidden = (nama === 'dash');
  document.getElementById('btnAdd').hidden = (nama !== 'tx');
  document.getElementById('btnRiwayat').hidden = (nama !== 'tx');
  document.getElementById('btnEdit').hidden = (nama !== 'tx');
  document.getElementById('btnHapus').hidden = (nama !== 'tx');
  if (nama !== 'tx') barisDipilih = 0;
  siapkanTombolBaris();
  document.getElementById('title').textContent =
    (nama === 'sub' ? t(sub) : JUDUL[nama]()) + ' · ' + (B() ? B().labelSingkat : '');
  document.querySelectorAll('.tabs button').forEach(function (b) {
    var tb = b.getAttribute('data-tab');
    b.classList.toggle('on', tb === (nama === 'dash' ? 'dash' : (nama === 'tx' || nama === 'input') ? 'tx' : 'set'));
  });
  document.querySelector('.body:not([hidden])').scrollTop = 0;
  gambar();
}

function ke(nama, sub) {
  if (layar !== nama || (nama === 'sub' && subNama !== sub)) riwayatLayar.push([layar, subNama]);
  tampil(nama, sub);
}
function kembali() {
  var s = riwayatLayar.pop();
  if (s) tampil(s[0], s[1]); else tampil('dash');
}

/* satu baris tabel. pr = bagian dari pasangan (transfer / bunga + pajak) */
function barisTabel(x, pr) {
  var masuk = x.arah === 'D';
  var kelas = (pr ? 'pr' : '') + (x.id === barisDipilih ? ' dipanggil' : '');
  return '<tr data-tx="' + x.id + '"' + (kelas ? ' class="' + kelas + '"' : '') + '>' +
    '<td class="c-tgl">' + tglRingkas(x.tanggal) + '</td>' +
    '<td><div class="ket" title="' + esc(x.ket) + '">' + esc(x.ket) +
      (x.pasangan ? ' <span class="bd">⇄</span>' : '') +
      (x.pajak ? ' <span class="bd pajak">' + t('pajak') + '</span>' : '') + '</div>' +
      '<div class="sub" title="' + esc(t(x.tag) + ' · ' + x.fund) + '">' + ikonTag(x.tag) + ' ' +
      esc(t(x.tag)) + ' · ' + esc(x.fund) + '</div></td>' +
    '<td class="c-dk">' + (masuk ? 'D' : 'K') + '</td>' +
    '<td class="c-jml">' + (masuk ? '+' : '−') + rp2(x.jumlah) + '</td>' +
    '</tr>';
}

/* kerangka tabel. grup = [{ judul: html kelompok (boleh kosong), isi: baris html }] */
function tabelTx(grup) {
  var h = '<div class="txw"><table class="txt"><thead><tr>' +
    '<th class="c-tgl">' + t('Tgl') + '</th>' +
    '<th>' + t('Keterangan') + '</th>' +
    '<th class="c-dk">' + t('Tipe') + '</th>' +
    '<th class="c-jml">' + t('Jumlah') + '</th>' +
    '</tr></thead><tbody>';
  grup.forEach(function (g) {
    if (g.judul) h += '<tr class="grp"><td colspan="4">' + g.judul + '</td></tr>';
    h += g.isi;
  });
  return h + '</tbody></table></div>';
}

/* satu kelompok: pasangan dirapatkan HANYA kalau KEDUA anggotanya ada di kelompok ini
   (aturan 25 Sep: pasangan Bunga + Pajak beda tag tidak boleh tampil dua kali). */
function rowsKelompok(arr) {
  var h = '', sudah = {};
  arr.forEach(function (x) {
    if (sudah[x.id]) return;
    var anggota = anggotaPasangan(x);
    var seKelompok = anggota.length > 1 && anggota.every(function (y) {
      return arr.indexOf(y) !== -1;
    });
    if (seKelompok) {
      anggota.forEach(function (y) { sudah[y.id] = 1; h += barisTabel(y, true); });
      return;
    }
    sudah[x.id] = 1;
    h += barisTabel(x, false);
  });
  return h;
}

/* 🔗 KUNCI PASANGAN
   ⚠️ PENTING: `transfer_pair_id` BUKAN nomor grup bersama.
   Ia MENUNJUK ke id pasangannya — jadi #2997 punya pair=2996 dan sebaliknya.
   Karena itu kuncinya = id terkecil + id terbesar (urutan tidak penting). */
function kunciPasangan(x) {
  if (!x.pasangan) return '';
  var a = x.id, b = x.pasangan;
  return (a < b ? a + '-' + b : b + '-' + a);
}

/** Ambil semua anggota pasangan pada daftar yang sedang tampil.
 *  Kalau pasangannya ada di bulan lain → kembalikan hanya dirinya (tampil sendiri). */
function anggotaPasangan(x) {
  var k = kunciPasangan(x);
  if (!k) return [x];
  var arr = TX().filter(function (y) { return kunciPasangan(y) === k; });
  return arr.length > 1 ? arr : [x];
}

/** Urut transaksi: TERBARU di atas (tanggal turun, lalu nomor besar dulu). */
function urutTanggal(a, b) {
  if (a.tanggal !== b.tanggal) return a.tanggal < b.tanggal ? 1 : -1;
  return b.id - a.id;
}

function gbrTx() {
  var b = B();
  var wadahChips = document.getElementById('chips');
  if (!b) { bukaKosong('txDaftar'); return; }
  if (!wadahChips) return;       /* pengaman — jangan sampai layar error */

  /* pilihan urutan: Tanggal · Tag · Masuk ＋ · Keluar − */
  gambarSegUrut();

  /* SOURCE FUND — hemat ruang (revisi Bapak 25 Sep 2026):
     yang tampak hanya SATU baris = fund yang sedang dipilih.
     Klik baris itu → grid fund terbuka. Pilih fund → grid menutup lagi. */
  wadahChips.classList.toggle('ada', fundSaring !== '');
  wadahChips.classList.toggle('terbuka', chipsTerbuka);

  var fokusChip = fundSaring ? FUND().filter(function (f) { return f.nama === fundSaring; })[0] : null;
  var hc = '<button class="kepala" data-buka="1" title="' +
    esc(t('Pilih sumber dana')) + '">' +
    '<span class="nm">' + esc(fokusChip ? fokusChip.ikon + ' ' + fokusChip.nama : t('Semua Fund')) + '</span>' +
    (fokusChip ? '<span class="pn mono">' + rpRingkas(fokusChip.saldo) + '</span>' : '') +
    '<span class="ar">' + (chipsTerbuka ? '▴' : '▾') + '</span></button>';

  if (chipsTerbuka) {
    hc += '<div class="chipgrid" style="--kolom:' + hitungKolom(kolomFund, wadahChips) + '">';
    hc += '<button class="chip semua' + (fundSaring === '' ? ' on' : '') + '" data-fund="">' +
      t('Semua Fund') + '</button>';
    FUND().forEach(function (f) {
      hc += '<button class="chip' + (fundSaring === f.nama ? ' on' : '') + '" data-fund="' +
        esc(f.nama) + '" title="' + esc(f.nama + ' — ' + rp2(f.saldo) + ' Rp') + '">' +
        f.ikon + ' ' + esc(f.nama) + '</button>';
    });
    hc += '</div>';
  }
  wadahChips.innerHTML = hc;

  /* kotak saldo fund terpilih — 4 kolom sejajar:
     Saldo awal · Masuk · Keluar · Saldo akhir (permintaan Bapak 25 Sep 2026) */
  var fokus = fundSaring ? FUND().filter(function (f) { return f.nama === fundSaring; })[0] : null;
  if (fokus) {
    document.getElementById('txSaldo').innerHTML =
      '<div class="saldo" style="margin-bottom:10px"><div class="grid k4">' +
      '<div class="cell"><div class="k">' + t('Saldo awal') + '</div><div class="v mono">' +
        rpRingkas(fokus.saldoAwal) + '</div></div>' +
      '<div class="cell"><div class="k">' + t('Masuk') + '</div><div class="v mono">+' +
        rpRingkas(fokus.masuk) + '</div></div>' +
      '<div class="cell"><div class="k">' + t('Keluar') + '</div><div class="v mono">−' +
        rpRingkas(fokus.keluar) + '</div></div>' +
      '<div class="cell"><div class="k">' + t('Saldo akhir') + '</div><div class="v mono' +
        (fokus.saldo < 0 ? ' neg' : '') + '">' + rpRingkas(fokus.saldo) + '</div></div>' +
      '</div></div>';
  } else {
    document.getElementById('txSaldo').innerHTML = '';
  }

  /* saring */
  var daftar = TX().filter(function (x) {
    if (fundSaring && x.fund !== fundSaring) return false;
    if (urut === 'tag' && tagSaring && x.tag !== tagSaring) return false;
    if (cariTeks && x.ket.toLowerCase().indexOf(cariTeks) === -1 &&
        x.tag.toLowerCase().indexOf(cariTeks) === -1 &&
        x.fund.toLowerCase().indexOf(cariTeks) === -1) return false;
    return true;
  });

  /* jumlahkan yang tersaring */
  var masuk = 0, keluar = 0;
  daftar.forEach(function (x) { if (x.arah === 'D') masuk += x.jumlah; else keluar += x.jumlah; });

  var h = '', kotak = [];
  if (daftar.length) {
    h += '<div class="hint"><b>' + daftar.length + '</b> ' + t('transaksi') + ' · ' +
      t('Masuk') + ' <b class="mono">+' + rp2(masuk) + '</b> · ' +
      t('Keluar') + ' <b class="mono">−' + rp2(keluar) + '</b></div>';
  }

  if (!daftar.length) {
    h += '<div class="empty">' + t('Tidak ketemu') + '</div>';
  }

  /* ---------- URUTAN ① TANGGAL (urutan biasa) ---------- */
  else if (urut === 'tanggal') {
    var grup = [], petaGrup = {};
    daftar.forEach(function (x) {
      if (!petaGrup[x.tanggal]) { petaGrup[x.tanggal] = []; grup.push(x.tanggal); }
      petaGrup[x.tanggal].push(x);
    });
    grup.forEach(function (tanggal) {
      kotak.push({
        judul: tglPanjang(tanggal) + (tanggal === hariIniISO() ? ' · ' + t('hari ini') : ''),
        isi: rowsKelompok(petaGrup[tanggal])
      });
    });
  }

  /* ---------- URUTAN ② TAG (kelompok per tag + total) ---------- */
  else if (urut === 'tag') {
    /* daftar pilihan tag — tertutup, hemat ruang */
    var daftarTag = TAG().filter(function (g) {
      return daftar.some(function (x) { return x.tag === g.nama; });
    });
    h += '<button class="tagsum" data-tagbuka="1">' +
      '<span class="nm">' + (tagSaring ? ikonTag(tagSaring) + ' ' + esc(t(tagSaring))
        : '🏷️ ' + t('Semua Tag')) + '</span>' +
      '<span class="ar">' + (tagTerbuka ? '▴' : '▾') + '</span></button>';

    if (tagTerbuka) {
      h += '<div class="chipgrid buka" style="--kolom:' +
        hitungKolom(kolomTag, document.getElementById('txDaftar')) + '">';
      h += '<button class="chip semua' + (tagSaring === '' ? ' on' : '') +
        '" data-tag="">' + t('Semua Tag') + '</button>';
      daftarTag.forEach(function (g) {
        h += '<button class="chip' + (tagSaring === g.nama ? ' on' : '') +
          '" data-tag="' + esc(g.nama) + '">' + g.ikon + ' ' + esc(t(g.nama)) + '</button>';
      });
      h += '</div>';
    }

    /* kelompok per tag — besar di atas */
    var grupTag = [], petaTag = {};
    daftar.forEach(function (x) {
      if (!petaTag[x.tag]) { petaTag[x.tag] = []; grupTag.push(x.tag); }
      petaTag[x.tag].push(x);
    });
    grupTag.sort(function (a, c) { return petaTag[c].length - petaTag[a].length; });

    grupTag.forEach(function (namaTag) {
      var arr = petaTag[namaTag].slice().sort(urutTanggal);
      var tm = 0, tk = 0;
      arr.forEach(function (x) { if (x.arah === 'D') tm += x.jumlah; else tk += x.jumlah; });
      kotak.push({
        judul: '<b>' + ikonTag(namaTag) + ' ' + esc(t(namaTag)) + ' · ' + arr.length + ' ' + t('transaksi') + '</b> ' +
          '<span class="mono">' + (tm > 0 ? '+' : '') + rp2(tm) + ' ' + t('Masuk') +
          ' · ' + (tk > 0 ? '−' : '') + rp2(tk) + ' ' + t('Keluar') + '</span>',
        isi: rowsKelompok(arr)
      });
    });
  }

  /* ---------- URUTAN ③ MASUK ＋ / ④ KELUAR − ----------
     Satu daftar lurus (tanpa kelompok), diurut JUMLAH TERBESAR di atas.
     Tanggal tetap tertera di tiap baris. */
  else {
    var mau = (urut === 'masuk') ? 'D' : 'K';
    var arr2 = daftar.filter(function (x) { return x.arah === mau; })
      .sort(function (a, c) { return c.jumlah - a.jumlah; });
    kotak.push({ judul: '', isi: arr2.map(function (x) { return barisTabel(x, false); }).join('') });
  }
  if (kotak.length) h += tabelTx(kotak);

  document.getElementById('txDaftar').innerHTML = h;
  pasangKlik(document.getElementById('txDaftar'));

  /* ketuk satu baris = "panggil data lama" → tombol ✎ ✕ jadi hitam */
  document.querySelectorAll('#txDaftar tbody tr[data-tx]').forEach(function (tr) {
    tr.addEventListener('click', function () {
      var id = Number(tr.getAttribute('data-tx'));
      barisDipilih = (barisDipilih === id) ? 0 : id;   /* ketuk lagi = lepas */
      gbrTx();
    });
  });

  /* klik kepala pemilih tag → buka/tutup daftar tag */
  var tglBuka = document.querySelector('#txDaftar .tagsum');
  if (tglBuka) {
    tglBuka.addEventListener('click', function () { tagTerbuka = !tagTerbuka; gbrTx(); });
  }
  document.querySelectorAll('#txDaftar .chipgrid [data-tag]').forEach(function (c) {
    c.addEventListener('click', function () {
      tagSaring = c.getAttribute('data-tag') || '';
      tagTerbuka = false;
      gbrTx();
    });
  });

  /* klik baris fund terpilih → buka/tutup grid */
  wadahChips.querySelectorAll('.kepala').forEach(function (c) {
    c.addEventListener('click', function () {
      chipsTerbuka = !chipsTerbuka;
      gbrTx();
    });
  });
  /* pilih fund → grid MENUTUP lagi, barisnya berganti nama fund itu */
  wadahChips.querySelectorAll('.chipgrid .chip').forEach(function (c) {
    c.addEventListener('click', function () {
      fundSaring = c.getAttribute('data-fund');
      chipsTerbuka = false;
      riwayatLayar = [];
      gbrTx();
    });
  });

  /* tombol ✎ ✕ di kepala ikut menyesuaikan setiap daftar digambar */
  siapkanTombolBaris();
}

/* jumlah kolom kartu.
   Cara hitung: LEBAR SASARAN per kartu, dibulatkan, maksimum 5.
   • LEBAR_AMAN = batas paling sempit supaya kartu tidak terlalu sempit.
   • Nama fund DIPOTONG dengan `…` kalau tidak muat — keputusan Bapak.
   • 🔴 Angka tidak pernah dipotong (hanya patah di titik ribuan). */
var LEBAR_SASARAN = 78;   /* sasaran lebar satu kartu */
/* 🔴 Lebar paling sempit yang MASIH AMAN (25 Sep 2026).
   Dulu 72 px → kartu terlalu sempit: angka panjang (`22.057.864,95`) turun
   baris dan nama seperti "Superbank" terpotong di tengah kata ("Superba/nk").
   Aturan Bapak: **angka jangan sampai salah baca** → 96 px. */
var LEBAR_AMAN = 96;
var JARAK_KARTU = 6;
var KOLOM_MAKS = 5;
var kolomFund = 'auto';
var kolomTag = 'auto';

/** Berapa kolom yang benar-benar dipakai.
 *  ⚠️ Lebar diambil dari wadah grid (CLIENT width) — dihitung TANPA padding
 *     halaman. Kalau padding ikut dihitung, kolom jadi kelebihan satu dan
 *     nama fund terpotong (bug nyata 25 Sep).
 *  🔴 SETIAP halaman WAJIB mengirim wadahnya sendiri (mis. `#dashIsi`,
 *     `#subIsi`) — semuanya selebar isi `.body` → jumlah kolom PASTI sama.
 *     (Bug nyata 25 Sep: Dashboard 3 kolom vs Daftar Fund 4 kolom karena
 *      Dashboard memakai lebar cadangan yang berbeda.) */
function hitungKolom(pilih, wadahUkur) {
  var lebar = 0;
  if (wadahUkur && wadahUkur.clientWidth) lebar = wadahUkur.clientWidth;
  if (!lebar) {
    /* cadangan: lebar jendela − padding halaman kiri+kanan.
       Dipakai kalau wadah sedang disembunyikan (clientWidth = 0). */
    var jendela = document.documentElement.clientWidth || window.innerWidth || 384;
    lebar = Math.max(120, jendela - 24);
  }

  /* paling banyak yang masih AMAN (kata terpanjang tidak terpotong) */
  var aman = Math.floor((lebar + JARAK_KARTU) / (LEBAR_AMAN + JARAK_KARTU));
  aman = Math.max(2, Math.min(KOLOM_MAKS, aman));

  /* sasaran enak dibaca, tapi tidak boleh melebihi batas aman */
  var sasaran = Math.round(lebar / LEBAR_SASARAN);
  sasaran = Math.max(2, Math.min(KOLOM_MAKS, sasaran));

  var hasil = Math.min(sasaran, aman);
  if (pilih === 'auto') return hasil;
  var mau = parseInt(pilih, 10) || hasil;
  return Math.max(2, Math.min(mau, aman));
}

function gayaGrid(jenis, wadah) {
  var pilih = (jenis === 'fund' ? kolomFund : kolomTag);
  return ' style="--kolom:' + hitungKolom(pilih, wadah) + '"';
}

/* tombol pengatur jumlah kolom, supaya Bapak bisa mengatur sendiri */
function tombolKolom(jenis, wadah) {
  var sekarang = jenis === 'fund' ? kolomFund : kolomTag;
  var terpakai = hitungKolom(sekarang, wadah);
  var pilih = [['auto', t('Otomatis') + ' (' + terpakai + ')'], ['3', '3'], ['4', '4'], ['5', '5']];
  var h = '<div class="seg">';

    h += '<button class="' + (sekarang === p[0] ? 'on' : '') + '" data-kolom="' +
      p[0] + '" data-jenis="' + jenis + '">' + esc(p[1]) + '</button>';
  });
  return h + '</div>';
}

/* ---------- SATU pembuat kartu fund — dipakai Daftar Fund & Dashboard ----------
   Dibuat 25 Sep 2026 supaya TIDAK ada dua versi penataan/logika (aturan C12/C17).
   🔴 ANGKA TIDAK DIPOTONG — hanya boleh patah di titik ribuan (pecahAngka).
   🔴 Lencana 🔒 diblokir / 👥 titipan DITARUH DI DEPAN keterangan supaya tidak
      ikut terpotong (tanda ini penting bagi Bapak).
   🔴 Nama fund BOLEH dipotong `…` (2 baris) — nama lengkap ada di tooltip. */
function kartuFund(f) {
  var bawah = f.minSaldo !== null && f.minSaldo !== undefined && f.saldo < f.minSaldo;
  var tanda = [];
  if (f.diblokir) tanda.push('🔒');
  if (f.titipan) tanda.push('👥');
  var ket = t('awal') + ' ' + rpRingkas(f.saldoAwal);
  if (f.n) ket += ' · ' + f.n + ' tx';
  if (tanda.length) ket = tanda.join('') + ' · ' + ket;
  /* tooltip: nama LENGKAP + saldo penuh — supaya nama yang terpotong
     masih bisa dibaca utuh dengan menekan lama */
  var tip = f.nama + ' — ' + rp2(f.saldo) + ' Rp' +
    (tanda.length ? ' (' + (f.diblokir ? 'diblokir ' : '') + (f.titipan ? 'titipan' : '') + ')' : '');
  return '<div class="item' + (bawah ? ' warn' : '') + '" title="' + esc(tip) + '">' +
    '<span class="baris"><span class="ic">' + f.ikon + '</span>' +
      '<span class="nm">' + esc(f.nama) + '</span></span>' +
    '<span class="val mono' + (f.saldo < 0 ? ' neg' : '') + '">' + pecahAngka(rp2(f.saldo)) + '</span>' +
    '<span class="sub">' + esc(ket) + '</span>' +
    '</div>';
}

/** Buka borang dalam mode UBAH, isi dengan data tag yang dipilih. */
function mulaiUbahTag(id) {
  var g = TAG().filter(function (x) { return x.id === id; })[0];
  if (!g) return;
  if (g.sistem) { pesan(t('Tag sistem tidak bisa diubah.')); return; }
  tagForm = {
    mode: 'ubah', id: g.id, nama: g.nama, ikon: g.ikon,
    arah: (g.arah === 'D' || g.arah === 'K') ? g.arah : '',
    pajak: !!g.pajak, belanja: !!g.belanja
  };
  gbrSub();
  var el = document.getElementById('tfNama');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}

/** Simpan tag (tambah atau ubah) ke server. */
function simpanTag() {
  if (!BISA_TULIS) { pesan(t('Versi HP ini hanya untuk MELIHAT.')); return; }
  var nama = (document.getElementById('tfNama').value || '').trim();
  var arah = document.getElementById('tfArah').value;
  var pajak = document.getElementById('tfPajak').checked;
  var belanja = document.getElementById('tfBelanja').checked;
  var ikon = (tagForm && tagForm.ikon) || '🏷️';

  if (!nama) { pesan(t('Nama tag belum diisi.')); return; }
  if (nama.length > 30) { pesan(t('Nama tag paling banyak 30 huruf.')); return; }

  var ubah = tagForm && tagForm.mode === 'ubah';
  var tombol = document.getElementById('tfSimpan');
  if (tombol) { tombol.disabled = true; tombol.textContent = t('Menyimpan…'); }

  var isi = { nama: nama, ikon: ikon, arah: arah || null, pajak: pajak, belanja: belanja };
  if (ubah) isi.id = tagForm.id;

  panggilServer(ubah ? 'ubahTag' : 'tambahTag', isi).then(function () {
    tagForm = null;
    return muatDariServer();
  }).then(function () {
    gbrSub();
    pesan(ubah ? t('Tag sudah diubah.') : t('Tag baru sudah ditambahkan.'));
  }).catch(function (e) {
    if (tombol) { tombol.disabled = false; tombol.textContent = ubah ? t('Simpan perubahan') : t('Tambah'); }
    pesan(e.message);
  });
}

/** Hapus tag (soft delete). Ditolak server kalau masih dipakai transaksi. */
function hapusTag(id) {
  if (!BISA_TULIS) { pesan(t('Versi HP ini hanya untuk MELIHAT.')); return; }
  var g = TAG().filter(function (x) { return x.id === id; })[0];
  if (!g) return;
  if (g.sistem) { pesan(t('Tag sistem tidak bisa dihapus.')); return; }
  if (!confirm(t('Hapus tag') + ' "' + g.nama + '"?' + '\n\n' +
      t('Tag yang masih dipakai transaksi tidak bisa dihapus.'))) return;

  panggilServer('hapusTag', { id: id }).then(function () {
    if (tagForm && tagForm.id === id) tagForm = null;
    return muatDariServer();
  }).then(function () {
    gbrSub();
    pesan(t('Tag sudah dihapus.'));
  }).catch(function (e) { pesan(e.message); });
}

/* Lebar kolom baris jurnal — menyesuaikan lebar layar supaya tetap 1 baris.
   Dipanggil saat menggambar form & saat layar berubah ukuran. */
function aturLebarBaris() {
  var akar = document.getElementById('inputIsi');
  if (!akar) return;
  /* ukur lebar baris yang SEBENARNYA (bukan menebak dari lebar jendela) */
  var kartu = akar.querySelector('.tl-card');
  var lebar = kartu ? kartu.clientWidth - 20 : akar.clientWidth - 20;
  if (lebar < 120) lebar = 120;

  /* 🔴 ARAHAN BAPAK 19 Okt 2026: *"space nilai di kecilkan sampai 100.000.000,99
     karena saya mau space sumber dan tag lebih lebar.. sisanya dibagi 3.. untuk
     sumber tag dan debit / kredit"*
     → HARGA DIKUNCI (cukup untuk 100.000.000,99), sisanya dibagi 2 untuk
       sumber & tag. D/K cukup sekecil yang perlu (isinya 1 kata). */

  /* lebar tetap (px) — diukur dari isi sebenarnya */
  var W_HARGA = 90;    /* "100.000.000,99" pada font 11px tebal */
  var W_HAPUS = 26;
  var W_DK    = 46;    /* "Kredit" / "Debit" */
  var MIN_FUND = 34;   /* batas paling sempit supaya panah pulldown tetap terlihat */
  var MIN_TAG  = 40;

  var JARAK = 4;
  var sempit = lebar < 340;
  if (sempit) { JARAK = 3; W_DK = 30; W_HAPUS = 22; W_HARGA = 78; }

  var sisa = lebar - JARAK * 4 - W_HARGA - W_HAPUS - W_DK;

  /* layar sempit → kecilkan harga dulu supaya sumber & tag tetap dapat ruang
     (harga tetap cukup untuk 100.000.000,99 karena hurufnya ikut mengecil) */
  if (sisa < MIN_FUND + MIN_TAG) {
    var kurang = (MIN_FUND + MIN_TAG) - sisa;
    W_HARGA = Math.max(64, W_HARGA - kurang);
    sisa = lebar - JARAK * 4 - W_HARGA - W_HAPUS - W_DK;
  }
  if (sisa < 0) sisa = 0;

  /* sisa dibagi 2 → sumber & tag sama lebar */
  var w1 = Math.floor(sisa / 2);
  var w2 = sisa - w1;

  /* 🔴 19 Okt 2026 (koreksi Bapak): di PC sumber & tag jadi TERLALU LEBAR
     (266 px) sehingga baris terlihat kosong. Dibatasi: cukup untuk nama
     terpanjang + panah pulldown.
     🔴 SELURUH sisa ruang diberikan ke HARGA — kalau tidak, baris menyisakan
     ruang kosong 158 px di layar 960 px (bug nyata 19 Okt 2026). */
  var W_MAKS = 150;   /* batas lebar sumber & tag */
  if (w1 > W_MAKS) { w1 = W_MAKS; }
  if (w2 > W_MAKS) { w2 = W_MAKS; }
  var sisaHarga = sisa - w1 - w2;
  if (sisaHarga > 0) { W_HARGA += sisaHarga; }

  /* jangan pernah melebihi lebar baris (dulu bisa meluber 2 px di layar 360) */
  var total = w1 + w2 + W_DK + W_HARGA + W_HAPUS + JARAK * 4;
  if (total > lebar) { w2 -= (total - lebar); if (w2 < 24) w2 = 24; }
  akar.classList.toggle('tl-sempit', sempit);

  /* layar sangat sempit → huruf dikecilkan supaya tetap 1 baris */
  akar.style.setProperty('--fs', (lebar < 230 ? 9 : 11) + 'px');
  akar.style.setProperty('--w5', W_HAPUS + 'px');
  akar.style.setProperty('--w1', w1 + 'px');
  akar.style.setProperty('--w2', w2 + 'px');
  akar.style.setProperty('--w3', W_DK + 'px');
  akar.style.setProperty('--w4', W_HARGA + 'px');
}

var TES_KEY = 'uangku-tes-v1';
var BULAN_ASLI = null;
var formTes = null;
var KMAX_TES = 6;
/* 🔴 ARAH TAG — DIPELAJARI DARI SISTEM LAMA `c:\data\keuangan` (19 Okt 2026).
   Aturan Bapak: *"rumah > keluar, bunga > masuk, bonus > masuk, hilang > keluar,
   transfer > bebas, hutang > keluar. keluar > kredit dan masuk > debit .. sudah pasti"*

   Bukti data nyata `keuangan.db` (1.926 tx) — arah yang BENAR-BENAR dipakai:
     Rumah      D=0   K=99    → SATU arah (keluar)
     Pribadi    D=0   K=155   → SATU arah (keluar)
     Pet        D=0   K=35    → SATU arah (keluar)
     Mobil      D=0   K=2     → SATU arah (keluar)
     Bunga      D=189 K=0     → SATU arah (masuk)
     Bonus      D=140 K=0     → SATU arah (masuk)
     Pendapatan D=16  K=0     → SATU arah (masuk)
     Pajak      D=0   K=46    → SATU arah (keluar)
     Hilang     D=0   K=2     → SATU arah (keluar)
     Hutang     D=0   K=3     → SATU arah (keluar)
     biaya      D=0   K=10    → SATU arah (keluar)
     Tabungan   D=0   K=36    → SATU arah (keluar)
     ─────────────────────────────────────────────────────────────
     Transfer   D=362 K=323   → DUA arah (bebas)
     Pinjam     D=4   K=5     → DUA arah (bebas)
     Koreksi    D=6   K=1     → DUA arah (bebas)
     Reimburse  D=3   K=1     → DUA arah (bebas)

   → Jadi HANYA 4 tag ini yang BEBAS. Semua tag lain DIKUNCI ke arahnya:
     keluar = Kredit · masuk = Debit. */
var TAG_BEBAS = ['Transfer', 'Pinjam', 'Koreksi', 'Reimburse'];

/* Keadaan borang tag di Pengaturan → Daftar Tag.
   null = borang kosong (mode TAMBAH). Diisi = mode UBAH. */
var tagForm = null;

/* 🔴 Boleh menulis tag atau tidak.
   `uangku.html` = versi HP MANDIRI → BACA SAJA (aturan C18), jadi false.
   `tools/bangun-cloud.cjs` menggantinya menjadi true untuk halaman cloud
   (di sana ada `panggilServer`). Jangan diubah manual. */
var BISA_TULIS = true;

/* Pilihan ikon tag — sama dengan daftar di sistem lama
   (`c:\data\keuangan\src\components\Settings.tsx` EMOJI_LIST). */
var EMOJI_TAG = [
  '🏠', '👤', '👧', '🚗', '🚕', '🌸', '💵', '🔄', '🧾', '🛒',
  '💰', '⚡', '📦', '🐾', '🐱', '🐕', '🎯', '📱', '💻', '🎮',
  '✈️', '🏖️', '🎓', '💊', '🏥', '🍽️', '☕', '🍺', '🎵', '📚',
  '🎁', '💳', '🏦', '📈', '📉', '🔧', '✂️', '🧹', '🏋️', '🎬'
];

/* Tag bawaan form: tag PERTAMA yang arahnya terkunci (bukan tag dua arah).
   Kalau tidak ada, baru pakai 'Transfer'. */
function tagBawaan(bln) {
  if (!bln || !bln.tag || !bln.tag.length) return 'Transfer';
  var tetap = bln.tag.filter(function (g) {
    return TAG_BEBAS.indexOf(g.nama) === -1;
  });
  return tetap.length ? tetap[0].nama : 'Transfer';
}
function numTes(s) { var n = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
function bacaTes() { try { return JSON.parse(localStorage.getItem(TES_KEY) || '[]'); } catch (e) { return []; } }
function simpanTesKeMemori(arr) { localStorage.setItem(TES_KEY, JSON.stringify(arr)); }
function bulanDariTgl(tgl) {
  for (var i = 0; i < BULAN.length; i++) if (tgl >= BULAN[i].awal && tgl <= BULAN[i].akhir) return BULAN[i];
  return null;
}
/* Arah yang DIKUNCI tag (tombol mati). Tag bebas → null (boleh diklik).
   🔴 BEBAS kalau: ① termasuk 4 tag bawaan bebas, ATAU ② tag itu sendiri
      tidak punya arah tetap (`journal_type` kosong) — mis. tag BARU yang
      dibuat dengan pilihan "— Bebas —" di Pengaturan › Daftar Tag.
      Tanpa ②, tag baru langsung terkunci Kredit padahal Bapak memilih Bebas. */
function arahTetapTag(nama) {
  if (TAG_BEBAS.indexOf(nama) !== -1) return null;
  var tg = (B() ? B().tag : []).filter(function (x) { return x.nama === nama; })[0];
  if (!tg) return 'K';
  return (tg.arah === 'D' || tg.arah === 'K') ? tg.arah : null;
}

/* Arah BAWAAN tag (dipakai saat Bapak memilih tag).
   Tag terkunci → arahnya sendiri. Tag bebas → arah bawaan dari server
   (`journal_type`), kalau tidak ada → 'K'. */
function arahBawaanTag(nama) {
  var kunci = arahTetapTag(nama);
  if (kunci) return kunci;
  var tg = (B() ? B().tag : []).filter(function (x) { return x.nama === nama; })[0];
  return (tg && (tg.arah === 'D' || tg.arah === 'K')) ? tg.arah : 'K';
}

/* tidak dipakai lagi — data datang utuh dari server */
function terapkanTes() {
  if (true) return;
  if (!BULAN_ASLI) BULAN_ASLI = JSON.parse(JSON.stringify(BULAN));
  BULAN = JSON.parse(JSON.stringify(BULAN_ASLI));
  bacaTes().forEach(function (e) {
    var bln = bulanDariTgl(e.tgl);
    if (!bln) return;
    e.baris.forEach(function (b, i) {
      var n = numTes(b.jml);
      var f = bln.fund.filter(function (x) { return x.nama === b.fund; })[0];
      if (!(n > 0) || !f) return;
      bln.tx.push({ id: e.id * 10 + i, tanggal: e.tgl, ket: '[TES] ' + e.ket, jumlah: n, arah: b.arah,
        tag: b.tag, fund: b.fund, fid: f.id, pasangan: 0, pajak: false, catatan: 'tes' });
      if (b.arah === 'D') { f.masuk += n; f.saldo += n; } else { f.keluar += n; f.saldo -= n; }
      f.masuk = Math.round(f.masuk * 100) / 100;
      f.keluar = Math.round(f.keluar * 100) / 100;
      f.saldo = Math.round(f.saldo * 100) / 100;
      f.n += 1;
    });
    bln.tx.sort(urutTanggal);
  });
}

function gbrInput() {
  var wadah = document.getElementById('inputIsi');
  var bln = B();
  if (!bln) { wadah.innerHTML = ''; return; }
  if (!formTes) formTes = { tgl: hariIniISO(), ket: '', baris: [
    { fund: bln.fund[0] ? bln.fund[0].nama : '', tag: tagBawaan(bln), arah: 'K', jml: '' },
    { fund: bln.fund[0] ? bln.fund[0].nama : '', tag: tagBawaan(bln), arah: 'K', jml: '' } ] };
  /* nilai option = nama LENGKAP (dipakai saat menyimpan), tulisan = singkatan 3 huruf */
  /* 🔴 19 Okt 2026: nama ditulis PENUH (bukan SPB/RMH) — Bapak lupa arti
     singkatannya. Nama kepanjangan dipotong "…" oleh CSS, nama penuh tetap
     terbaca saat daftar dibuka. */
  var pilihFund = function (sel) {

/* ringkasan: Masuk & Keluar HANYA dari tag yang dihitung laporan.
   Transfer · Koreksi · Pinjam · Hutang · Reimburse = uang numpang lewat, tidak dihitung (agents.md Bagian 9). */
var TAG_TIDAK_DIHITUNG = ['Transfer', 'Koreksi', 'Pinjam', 'Hutang', 'Reimburse'];
function hitungRingTes() {
  var masuk = 0, keluar = 0, per = {};
  formTes.baris.forEach(function (b) {
    var n = numTes(b.jml), a = arahTetapTag(b.tag) || b.arah;
    if (TAG_TIDAK_DIHITUNG.indexOf(b.tag) === -1) {
      if (a === 'D') masuk += n; else keluar += n;
    }
    per[b.fund] = (per[b.fund] || 0) + (a === 'D' ? n : -n);
  });
  var r = document.getElementById('tlRing');
  if (!r) return;
  var adaTransfer = formTes.baris.some(function (b) {
    return b.tag === 'Transfer' && numTes(b.jml) > 0;
  });
  r.innerHTML = (adaTransfer
      ? '<div class="peringatan-tag">⚠️ ' + t('Tag "Transfer" artinya uang PINDAH TEMPAT — tidak dihitung di Ringkasan bulan ini.') +
        '<br>' + t('Kalau ini belanja biasa, ganti tagnya (mis. Rumah / Pribadi / Pet).') + '</div>'
      : '') +
    '<div class="tl-r"><span>Total masuk (dihitung)</span><b class="mono">+' + rp2(masuk) + '</b></div>' +
    '<div class="tl-r"><span>Total keluar (dihitung)</span><b class="mono">' + (keluar ? '−' : '') + rp2(keluar) + '</b></div>' +
    Object.keys(per).map(function (f) {
      return '<div class="tl-r sub"><span>' + esc(f) + '</span><b class="mono">' + (per[f] >= 0 ? '+' : '') + rp2(per[f]) + '</b></div>';
    }).join('');
}

/* SIMPAN KE SERVER — satu tindakan boleh berisi beberapa jurnal.
   Tampilan TIDAK berubah; yang berganti hanya tujuannya (server). */
function simpanTesDariForm() {
  var tgl = document.getElementById('tlTgl').value;
  var ket = document.getElementById('tlKet').value.trim();
  var bln = bulanDariTgl(tgl);
  var isi = formTes.baris.filter(function (b) { return numTes(b.jml) > 0; });
  if (!bln) { pesan(t('Tanggal di luar bulan yang tersedia.')); return; }
  if (!ket) { pesan(t('Keterangan belum diisi.')); return; }
  if (!isi.length) { pesan(t('Belum ada jumlah yang diisi.')); return; }

  var tombol = document.getElementById('tlSimpan');
  if (tombol) { tombol.disabled = true; tombol.textContent = t('Menyimpan…'); }

  var ubah = (formTes.mode === 'ubah' && formTes.id);
  var b0 = isi[0];
  var f0 = FUND().filter(function (x) { return x.nama === b0.fund; })[0];
  var arah0 = arahTetapTag(b0.tag) || b0.arah;

  /* ✎ UBAH: Worker hanya mengubah SATU baris. Kalau Bapak menambah baris
     saat mengubah, baris pertama diubah dan sisanya dicatat sebagai baru. */
  var janji = ubah
    ? panggilServer('ubah', {
        id: Number(formTes.id), tanggal: tgl, keterangan: ket,
        fundId: f0 ? f0.id : 0, tag: b0.tag, arah: arah0, jumlah: numTes(b0.jml)
      }).then(function () {
        var sisa = isi.slice(1);
        if (!sisa.length) return null;
        return panggilServer('catat', {
          tanggal: tgl, keterangan: ket,
          baris: sisa.map(function (b) {
            var f = FUND().filter(function (x) { return x.nama === b.fund; })[0];
            return { fundId: f ? f.id : 0, tag: b.tag, arah: arahTetapTag(b.tag) || b.arah, jumlah: numTes(b.jml) };
          })
        });
      })
    : panggilServer('catat', {
        tanggal: tgl, keterangan: ket,
        baris: isi.map(function (b) {
          var f = FUND().filter(function (x) { return x.nama === b.fund; })[0];
          return { fundId: f ? f.id : 0, tag: b.tag, arah: arahTetapTag(b.tag) || b.arah, jumlah: numTes(b.jml) };
        })
      });

  janji.then(function () {
    formTes = null;
    barisDipilih = 0;
    return muatDariServer();
  }).then(function () {
    gbrInput();
    pesan(t(ubah ? 'Perubahan tersimpan.' : 'Tersimpan ke server.'));
  }).catch(function (e) {
    if (tombol) { tombol.disabled = false; tombol.textContent = t(ubah ? 'Simpan perubahan' : 'Simpan'); }
    pesan(e.message);
  });
}

/* 🔴 Angka harga diformat saat diketik (26.504.730,59) supaya mudah dibaca
   dan tidak salah hitung nol. Nilai aslinya tetap disimpan apa adanya. */
function formatJml(teks) {
  var bersih = String(teks).replace(/[^0-9,]/g, '');
  var pisah = bersih.split(',');
  var bulat = pisah[0].replace(/^0+(?=\d)/, '');
  var sen = pisah.length > 1 ? ',' + pisah.slice(1).join('').slice(0, 2) : '';
  if (!bulat && !sen) return '';
  return bulat.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + sen;
}

/* ============================================================
   14c. 🧾 PAJAK BUNGA OTOMATIS
   ------------------------------------------------------------
   Tag "Bunga" kena pajak (has_tax=1). Begitu baris Bunga diisi,
   baris Pajak muncul sendiri dengan angka rate dari server.
   ============================================================ */

/** Rate pajak bunga dari server (tax_config). Cadangan 20 kalau belum ada. */
function ratePajak() {
  var b = B();
  if (b && b.pajak && typeof b.pajak.rate === 'number') return b.pajak.rate;
  return 20;
}

/** Batas minimum bunga yang tidak dipotong pajak (0 = selalu dipotong). */
function minPajak() {
  var b = B();
  if (b && b.pajak && typeof b.pajak.minimum === 'number') return b.pajak.minimum;
  return 0;
}

/** Apakah baris ini tag Bunga yang masuk (D)? */
function barisBunga(b) {
  return b && b.tag === 'Bunga' && (arahTetapTag(b.tag) || b.arah) === 'D';
}

/** Apakah baris ini tag Pajak? */
function barisPajak(b) {
  return b && b.tag === 'Pajak';
}

/** Pajak = bunga × rate ÷ 100, dibulatkan 2 desimal (sen). */
function hitungPajak(bunga) {
  var n = Math.round(bunga * ratePajak()) / 100;
  return Math.round(n * 100) / 100;
}

/** Angka → teks 2 desimal gaya Indonesia (12328.76 → "12.328,76"). */
function jmlTeks(n) {
  return rp2(n);
}

/**
 * Selaraskan baris pajak dengan baris bunga.
 * Dipanggil setiap kali form digambar / jumlah berubah.
 *  • ada baris Bunga berisi  → pastikan ada baris Pajak tepat di bawahnya
 *  • tidak ada baris Bunga   → buang baris Pajak yang dibuat otomatis
 *  • Bapak sudah mengubah angka pajak sendiri → JANGAN ditimpa
 * Kembalian: true kalau JUMLAH BARIS berubah (perlu gambar ulang form).
 */
function selaraskanPajak() {
  if (!formTes || !formTes.baris) return false;
  var arr = formTes.baris;
  var berubah = false;

  /* buang baris pajak otomatis yang bunganya sudah tidak ada / kosong */
  for (var i = arr.length - 1; i >= 0; i--) {
    if (arr[i].auto && barisPajak(arr[i])) {
      var adaBunga = arr.some(function (x, j) {
        return j !== i && barisBunga(x) && numTes(x.jml) > 0;
      });
      if (!adaBunga) { arr.splice(i, 1); berubah = true; }
    }
  }

  /* tambahkan / perbarui baris pajak untuk tiap baris bunga */
  for (var k = 0; k < arr.length; k++) {
    var b = arr[k];
    if (!barisBunga(b)) continue;
    var bunga = numTes(b.jml);
    if (!(bunga > 0)) continue;
    if (bunga < minPajak()) continue;          /* bunga kecil → tidak dipotong */

    var pajak = hitungPajak(bunga);
    var sudah = arr[k + 1];
    if (sudah && barisPajak(sudah)) {
      /* Sudah ada baris pajak di bawahnya.
         Hitung ulang HANYA kalau jumlah bunganya berubah — supaya koreksi
         Bapak (mis. angka bank beda beberapa sen) tidak tertimpa saat form
         digambar ulang. */
      if (sudah.auto && sudah.dariBunga !== bunga) {
        sudah.jml = jmlTeks(pajak);
        sudah.fund = b.fund;
        sudah.dariBunga = bunga;
      }
      continue;
    }
    /* sisipkan baris pajak tepat di bawah baris bunga */
    arr.splice(k + 1, 0, {
      fund: b.fund, tag: 'Pajak', arah: 'K', jml: jmlTeks(pajak),
      auto: true, dariBunga: bunga
    });
    berubah = true;
    k++;
  }
  return berubah;
}

/**
 * Perbarui HANYA kotak angka baris pajak otomatis — tanpa menggambar ulang
 * seluruh form. Dipakai saat Bapak masih MENGETIK angka bunga.
 * 🔴 Bug nyata 19 Okt 2026: dulu tiap ketikan memanggil gbrInput() sehingga
 *    kotak input hilang & fokus lompat ke baris pajak.
 */
function segarkanPajak() {
  if (!formTes || !formTes.baris) return;
  var wadah = document.getElementById('inputIsi');
  if (!wadah) return;
  formTes.baris.forEach(function (b, i) {
    if (!b.auto) return;
    var kotak = wadah.querySelector('input.tl-jml[data-i="' + i + '"]');
    if (kotak && kotak.value !== b.jml) kotak.value = b.jml;
  });
}

/**
 * Gambar ulang form TAPI kembalikan fokus + posisi kursor ke kotak yang
 * sedang diisi. Dipakai kalau jumlah baris berubah (baris pajak muncul/hilang)
 * saat Bapak masih mengetik — supaya kursor tidak melompat.
 */
function gbrInputJagaFokus(i) {
  var wadah = document.getElementById('inputIsi');
  var kotak = wadah ? wadah.querySelector('input.tl-jml[data-i="' + i + '"]') : null;
  var pos = kotak ? kotak.selectionStart : null;
  gbrInput();
  if (!kotak) return;
  var baru = document.getElementById('inputIsi').querySelector('input.tl-jml[data-i="' + i + '"]');
  if (!baru) return;
  baru.focus();
  try {
    var p = (pos === null || pos > baru.value.length) ? baru.value.length : pos;
    baru.setSelectionRange(p, p);
  } catch (err) { /* diam */ }
}


/* ============================================================
   14d. 💬 PESAN SINGKAT (toast) — pengganti pesan()
   ------------------------------------------------------------
   Pesan muncul di bawah layar, hilang sendiri:
     • berhasil  → 2,6 detik
     • bermasalah → 6 detik (supaya sempat dibaca)
   Tidak ada tombol OK, tidak memblokir pekerjaan.
   ============================================================ */
function pesan(teks, jenis) {
  var w = document.getElementById('pesanWadah');
  if (!w) return;
  var d = document.createElement('div');
  d.className = 'pesan' + (jenis ? ' ' + jenis : '');
  d.textContent = teks;
  w.appendChild(d);
  setTimeout(function () { d.classList.add('tampil'); }, 10);
  setTimeout(function () {
    d.classList.remove('tampil');
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 300);
  }, jenis === 'salah' ? 6000 : 2600);
}

/* 🔴 Chrome menawarkan "Save password?" karena menemukan kolom type=password.
   UangKu tidak punya akun/password — PIN hanya kunci lokal (keluhan Bapak
   15 Okt 2026, muncul 2×). Percobaan pertama GAGAL: HTML masih type=password
   lalu diubah oleh skrip — Chrome sudah terlanjur memindai lebih dulu.
   Perbaikan: HTML LANGSUNG type=text + kelas .sandi (disamarkan CSS).
   Skrip di bawah hanya CADANGAN: kalau peramban tidak mendukung penyamaran,
   kolom dikembalikan ke type=password supaya PIN tidak terlihat. */
(function () {
  var p = document.getElementById('gPin');
  if (!p) return;
  var uji = document.createElement('input');
  uji.style.webkitTextSecurity = 'disc';
  if (uji.style.webkitTextSecurity !== 'disc') {
    p.type = 'password';
    p.classList.remove('sandi');
  }
})();


/* ============================================================
   14. CLOUD — pemuat data, gerbang PIN, layar Riwayat
   ============================================================ */

/** Bulan berikutnya dari sebuah kunci 'YYYY-MM'. */
function bulanBerikut(kunci) {
  var p = String(kunci).split('-');
  var th = Number(p[0]), bl = Number(p[1]);
  if (bl === 12) { th += 1; bl = 1; } else { bl += 1; }
  return th + '-' + (bl < 10 ? '0' + bl : String(bl));
}

/** Nama bulan yang enak dibaca dari kunci 'YYYY-MM'. */
function namaBulanKunci(kunci) {
  var p = String(kunci).split('-');
  var nm = ['Januari','Februari','Maret','April','Mei','Juni','Juli',
    'Agustus','September','Oktober','November','Desember'];
  return nm[Number(p[1]) - 1] + ' ' + p[0];
}

/**
 * Buka bulan baru — saldo awal diambil dari saldo akhir bulan terakhir.
 * Tanpa ini, mulai tanggal 1 bulan depan Bapak TIDAK BISA mencatat,
 * karena bulan baru belum punya saldo awal.
 */
function bukaBulanBaru() {
  if (!BULAN.length) { pesan(t('Belum ada data di server'), 'salah'); return; }
  var terakhir = BULAN[0].kunci;
  var tujuan = bulanBerikut(terakhir);
  if (!confirm(t('Buka bulan baru?') + '\n\n' + namaBulanKunci(terakhir) +
      ' → ' + namaBulanKunci(tujuan) + '\n' +
      t('Saldo awal bulan baru diambil dari saldo akhir bulan terakhir, lalu bulan lama dikunci.'))) return;

  panggilServer('bukaBulan', { bulan: tujuan }).then(function (r) {
    return muatDariServer().then(function () { return r; });
  }).then(function (r) {
    pesan(r.sudahAda
      ? t('Bulan itu sudah siap') + ': ' + namaBulanKunci(r.bulan)
      : t('Bulan baru siap') + ': ' + namaBulanKunci(r.bulan) + ' · ' +
        r.fund + ' fund · total ' + rp2(r.total) + ' Rp');
  }).catch(function (e) { pesan(e.message, 'salah'); });
}

/** Ambil seluruh data bulan dari server, lalu gambar ulang seperti biasa. */
function muatDariServer() {
  return panggilServer('bulan', { batas: CLOUD.bulanMaks }).then(function (r) {
    var daftar = r.data;
    if (!daftar.length) throw new Error('Belum ada data di server');
    return panggilServer('dashboard', { bulan: daftar });
  }).then(function (r) {
    BULAN = r.data;
    BULAN_ASLI = null;
    idxBulan = 0;
    if (!FUND().some(function (f) { return f.nama === fundSaring; })) fundSaring = FUND_AWAL;
    SIAP = true;
    gambarUlang();
    return true;
  });
}

/**
 * Apakah bulan berjalan sudah punya saldo awal?
 * Kalau belum, Bapak TIDAK BISA mencatat — jadi harus diberi tahu.
 * Dibandingkan dengan tanggal hari ini (WIB), bukan tanggal komputer.
 */
function bulanBerjalanBelumSiap() {
  if (!BULAN.length) return null;
  var kini = new Date(Date.now() + 7 * 3600 * 1000);
  var kunci = kini.getUTCFullYear() + '-' +
    (kini.getUTCMonth() + 1 < 10 ? '0' : '') + (kini.getUTCMonth() + 1);
  var ada = BULAN.some(function (b) { return b.kunci === kunci; });
  return ada ? null : kunci;
}

/** Pita peringatan di Dashboard — hanya muncul kalau memang perlu. */
function pitaBulanBaru() {
  var kurang = bulanBerjalanBelumSiap();
  if (!kurang) return '';
  return '<div class="pita-perlu">⚠️ ' + t('Bulan ini belum dibuka') + ': ' +
    esc(namaBulanKunci(kurang)) + ' — ' + t('buka dulu supaya bisa mencatat') +
    '<button class="btn-kecil" id="pitaBuka">' + t('Buka sekarang') + '</button></div>';
}

/* ---------- gerbang PIN ---------- */
function pasangGerbang() {
  var g = document.getElementById('gerbang');
  var ge = document.getElementById('gerbangPesan');
  document.getElementById('gPin').value = CLOUD.pin;
  document.getElementById('gAlamat').value = CLOUD.alamat;

  document.getElementById('gMasuk').addEventListener('click', function () {
    CLOUD.pin = document.getElementById('gPin').value.trim();
    CLOUD.alamat = document.getElementById('gAlamat').value.trim() || CLOUD.alamat;
    ge.className = 'gerbang-pesan tampil';
    ge.textContent = t('Menyambung…');
    simpanCloud();
    muatDariServer().then(function () {
      g.hidden = true;
      document.getElementById('tabs').hidden = false;
      document.querySelector('.head').hidden = false;
      tampil('dash');
      ge.className = 'gerbang-pesan';
    }).catch(function (e) {
      ge.className = 'gerbang-pesan tampil salah';
      ge.textContent = e.message;
    });
  });
}

/* ---------- layar Riwayat ---------- */
function gbrRiwayat() {
  var wadah = document.getElementById('riwayatIsi');
  if (!wadah) return;
  jadikanRiwayat = [];
  wadah.innerHTML = '<div class="sec">' + t('Riwayat perubahan') + '</div>' +
    '<div class="hint">' + t('Setiap catat, ubah, dan batalkan tercatat di sini. Bisa dikembalikan.') + '</div>' +
    '<div id="riwayatDaftar"><div class="empty">' + t('Sedang memuat…') + '</div></div>';

  panggilServer('riwayat', { batas: 60 }).then(function (r) {
    var kotak = document.getElementById('riwayatDaftar');
    if (!kotak) return;
    if (!r.data.length) { kotak.innerHTML = '<div class="empty">' + t('Belum ada riwayat') + '</div>'; return; }

    var nama = { CREATE: 'dibuat', UPDATE: 'diubah', DELETE: 'dibatalkan', RESTORE: 'dipulihkan' };
    kotak.innerHTML = '<div class="cover">' + r.data.map(function (x, i) {
      var isi = '';
      try {
        var o = x.new_data ? JSON.parse(x.new_data) : (x.old_data ? JSON.parse(x.old_data) : null);
        if (o) {
          if (o.keterangan) isi = o.keterangan;
          else if (o.description) isi = o.description;
          else if (o.baris) isi = o.baris.length + ' jurnal';
          else if (o.grup) isi = o.grup;
          var n = o.amount || (o.baris && o.baris.length ? o.baris.reduce(function (s, b) { return s + Number(b.jumlah || 0); }, 0) : 0);
          if (n) isi += ' · ' + rp2(n);
        }
      } catch (e) { isi = ''; }
      jadikanRiwayat[i] = x;
      var bisa = (x.action === 'DELETE' || x.action === 'RESTORE');
      var teksTombol = x.action === 'DELETE' ? ('↩️ ' + t('Pulihkan')) : t('Batalkan');
      return '<div class="crow"><span class="cl"><b>' + esc(String(x.timestamp).slice(5, 16)) + '</b> · ' +
        esc(t(nama[x.action] || x.action)) + '<br><small>' + esc(isi) + '</small></span>' +
        (bisa ? '<button class="btn-kecil" data-riw="' + i + '">' + teksTombol + '</button>' : '') + '</div>';
    }).join('') + '</div>';

    kotak.querySelectorAll('[data-riw]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = jadikanRiwayat[+b.getAttribute('data-riw')];
        if (!x) return;
        var aksi = x.action === 'DELETE' ? 'pulihkan' : 'batalkan';
        if (!confirm(t(aksi === 'pulihkan' ? 'Pulihkan transaksi ini?' : 'Batalkan transaksi ini?') + '\n' +
            t('Saldo fund akan menyesuaikan sendiri.'))) return;
        b.disabled = true;
        panggilServer(aksi, { id: Number(x.record_id) }).then(function () {
          return muatDariServer();
        }).then(function () {
          gbrRiwayat(); gbrDash();
        }).catch(function (e) { b.disabled = false; pesan(e.message, 'salah'); });
      });
    });
  }).catch(function (e) {
    var kotak = document.getElementById('riwayatDaftar');
    if (kotak) kotak.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  });
}
var jadikanRiwayat = [];

</script>
